services:
  identity-service:
    container_name: identity-service
    build:
      dockerfile: ./services/identity/src/main/docker/Dockerfile
      context: .
    networks:
      - pg-database-network

  product-service:
    container_name: product-service
    build:
      dockerfile: ./services/product/src/main/docker/Dockerfile
      context: .
    networks:
      - pg-database-network

  pg-database:
    container_name: postgres-database
    image: postgres:trixie
    env_file: 
      - ./services/pg-database/src/main/resources/secrets/compose.prod.env
    volumes:
      - pg-database-data-volume:/var/lib/postgresql/data/18/main:rw
    networks:
      - pg-database-network

  service-dev:
    container_name: service-dev
    build:
      dockerfile: ./docker/Dockerfile.service.dev
      context: .
    # Notice: no environment variablese are set, pass the environment file on demand
    user: "${UID:-1000}:${UID:-1000}"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} 
      - POSTGRES_USER=${POSTGRES_USER} 
      - POSTGRES_URL=${POSTGRES_URL} 
      - POSTGRES_DRIVER=${POSTGRES_DRIVER} 

    volumes:
      - ./:/payment-api/:rw
    networks:
      - pg-database-network

  postgres-dev:
    container_name: postgres-dev
    image: postgres:trixie
    env_file: 
      - ./services/pg-database/src/main/resources/secrets/compose.dev.env
    volumes:
      - pg-database-dev-data-volume:/var/lib/postgresql/data/18/main:rw
    ports:
      - "5432:5432"
    networks:
      - pg-database-network

volumes:
  pg-database-data-volume:
  pg-database-dev-data-volume:
  
networks:
  pg-database-network:
    driver: bridge