services:
  identity-service:
    container_name: identity-service
    build:
      dockerfile: ./services/identity/src/main/docker/Dockerfile
      context: .
    networks:
      - postgres-service-network

  product-service:
    container_name: product-service
    build:
      dockerfile: ./services/product/src/main/docker/Dockerfile
      context: .
    networks:
      - postgres-service-network

  postgres-service:
    container_name: postgres-service
    image: postgres:trixie
    env_file: 
      - ./services/pg-database/src/main/resources/secrets/compose.prod.env
    volumes:
      # Postgres database data
      - postgres-service-data:/var/lib/postgresql/data/18/main:rw
      # Automatically runs on first boot
      - ./services/pg-database/src/main/resources/migration/V0.0.0.base.secret.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - postgres-service-network

  migration-container:
    container_name: migration-container
    build:
      dockerfile: ./pg-database/Dockerfile.migration
      context: .
    env_file:
      - ./services/pg-database/src/main/resources/secrets/compose.prod.env

  # DEVELOPMENT CONTAINERS

  dev-service:
    image: dev-service:latest
    container_name: dev-service
    build:
      dockerfile: ./docker/Dockerfile.service.dev
      context: .
    # Notice: 
    # Environment variables values are not set by default,
    # Pass them using an environment file on demand.
    user: "${UID:-1000}:${UID:-1000}"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD} 
      - POSTGRES_USER=${POSTGRES_USER} 
      - POSTGRES_URL=${POSTGRES_URL} 
      - POSTGRES_DRIVER=${POSTGRES_DRIVER} 
    volumes:
      - ./:/payment-api/:rw
    networks:
      - postgres-service-network

  dev-postgres-service:
    container_name: dev-postgres-service
    image: postgres:trixie
    env_file: 
      - ./services/pg-database/src/main/resources/secrets/compose.dev.env
    volumes:
      - dev-postgres-service-data:/var/lib/postgresql:rw
       # Automatically runs on first boot
      - ./services/pg-database/src/main/resources/migration/V0.0.0.base.secret.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - postgres-service-network

  dev-migration-container:
    container_name: dev-migration-container
    build:
      dockerfile: ./services/pg-database/src/main/docker/Dockerfile.migration
      context: .
    env_file:
      - ./services/pg-database/src/main/resources/secrets/compose.dev.env
    networks:
      - postgres-service-network

volumes:
  postgres-service-data:
  dev-postgres-service-data:
  
networks:
  postgres-service-network:
    driver: bridge