spring:
  # Uses in-memory database for integration tests
  datasource:
    url: jdbc:h2:mem:servicerizedb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  liquibase:
    enabled: true
    change-log: classpath:changelog/db.changelog-master.yml

  jpa:  
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate